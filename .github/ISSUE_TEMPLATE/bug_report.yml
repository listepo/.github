name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or code that trigger the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Version, OS, and anything else relevant.
      placeholder: "version: ..., OS: ..."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant logs, error messages, or stack traces.
      render: shell
    validations:
      required: false
